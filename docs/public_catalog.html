<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: var(--bg-body, #0f172a);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        .catalog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .biz-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .biz-logo {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 1.5rem;
        }

        /* Layout styles */
        .catalog-grid {
            display: grid;
            gap: 1.25rem;
        }

        .catalog-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .catalog-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .catalog-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

        .catalog-grid.layout-list {
            grid-template-columns: 1fr !important;
        }

        .catalog-grid.layout-compact {
            grid-template-columns: 1fr !important;
        }

        .product-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .product-card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            margin-bottom: 0.5rem;
            align-self: flex-start;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #f8fafc;
        }

        .product-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            flex: 1;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid #334155;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .btn-order-wa {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-order-wa:hover {
            opacity: 0.9;
        }

        /* List Layout Specifics */
        .layout-list .product-card {
            flex-direction: row;
            align-items: center;
        }

        .layout-list .product-card-img {
            width: 160px;
            height: 100%;
            min-height: 140px;
        }

        /* Compact Layout Specifics */
        .layout-compact .product-card {
            flex-direction: row;
            align-items: center;
            padding: 0.75rem 1rem;
        }

        .layout-compact .product-card-img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            margin-right: 1rem;
        }

        .layout-compact .product-card-body {
            padding: 0;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .layout-compact .product-desc {
            display: none;
        }
    </style>
</head>
<body>

    <div id="catalog-container">
        <!-- Header -->
        <header class="catalog-header">
            <div class="biz-brand">
                <img id="cat-biz-logo" src="" class="biz-logo" style="display: none;">
                <div>
                    <h2 id="cat-biz-name" style="margin: 0; font-size: 1.25rem;">Cargando...</h2>
                    <p id="cat-biz-tagline" style="margin: 0; font-size: 0.82rem; color: #94a3b8;"></p>
                </div>
            </div>
            <div>
                <a id="btn-header-wa" href="#" target="_blank" class="btn-order-wa">Contactar WhatsApp</a>
            </div>
        </header>

        <!-- Search Bar -->
        <input type="text" id="catalog-search-input" class="search-bar" placeholder="Buscar producto en el catálogo..." style="display: none;">

        <!-- Products Grid -->
        <div id="products-grid" class="catalog-grid cols-3">
            <!-- Dynamic product cards -->
        </div>
    </div>

    <script src="config.js"></script>
    <script src="db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPublicCatalog();
        });

        function renderPublicCatalog() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('biz');

            let biz = null;
            if (slug) {
                biz = window.wisbeDB.getBusinessBySlug(slug);
            } else {
                const activeId = window.wisbeDB.getActiveBusinessId();
                biz = window.wisbeDB.getBusinessById(activeId);
            }

            if (!biz) {
                document.body.innerHTML = '<h2>Negocio no encontrado</h2>';
                return;
            }

            const catalogConfig = window.wisbeDB.getCatalogConfig(biz.id);
            const products = window.wisbeDB.getProducts(biz.id);

            // Apply Business Details
            document.getElementById('cat-biz-name').textContent = biz.name;
            document.getElementById('cat-biz-tagline').textContent = biz.tagline || '';
            if (biz.logo_url) {
                const logoImg = document.getElementById('cat-biz-logo');
                logoImg.src = biz.logo_url;
                logoImg.style.display = 'block';
            }

            const headerWaBtn = document.getElementById('btn-header-wa');
            if (biz.whatsapp) {
                headerWaBtn.href = `https://wa.me/${biz.whatsapp}?text=${encodeURIComponent('Hola, me gustaría solicitar información')}`;
            }

            // Apply Catalog Configs
            const grid = document.getElementById('products-grid');
            grid.className = `catalog-grid layout-${catalogConfig.layout_style || 'grid'} cols-${catalogConfig.columns || 3}`;

            const searchInput = document.getElementById('catalog-search-input');
            if (catalogConfig.show_search !== false) {
                searchInput.style.display = 'block';
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.description?.toLowerCase().includes(query));
                    renderProductsGrid(filtered, biz, catalogConfig);
                });
            }

            renderProductsGrid(products, biz, catalogConfig);
        }

        function renderProductsGrid(products, biz, config) {
            const grid = document.getElementById('products-grid');
            if (products.length === 0) {
                grid.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1;">No hay productos disponibles en este momento.</p>';
                return;
            }

            grid.innerHTML = products.map(p => {
                const waMessage = encodeURIComponent(`Hola ${biz.name}, me interesa el producto: ${p.name} ($${p.price.toFixed(2)})`);
                const waUrl = `https://wa.me/${biz.whatsapp || ''}?text=${waMessage}`;

                return `
                    <div class="product-card">
                        <img src="${p.image_url}" class="product-card-img" alt="${p.name}">
                        <div class="product-card-body">
                            ${config.badge_text ? `<span class="product-badge">${config.badge_text}</span>` : ''}
                            <h3 class="product-title">${p.name}</h3>
                            <p class="product-desc">${p.description || ''}</p>
                            <div class="product-footer">
                                ${config.show_prices !== false ? `<span class="product-price">$${p.price.toFixed(2)}</span>` : '<span></span>'}
                                <a href="${waUrl}" target="_blank" class="btn-order-wa" style="background: ${config.button_color || '#2563eb'}">
                                    Pedir por WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
